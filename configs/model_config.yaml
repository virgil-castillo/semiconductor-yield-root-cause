models:
  logistic_regression:
    C: [0.001, 0.01, 0.1, 1.0, 10.0]
    max_iter: 1000
    class_weight: balanced

  random_forest:
    n_estimators: [100, 200, 300]
    max_depth: [null, 5, 10, 20]
    min_samples_leaf: [1, 2, 5]
    class_weight: balanced

  xgboost:
    n_estimators: [100, 200, 300]
    max_depth: [3, 5, 7]
    learning_rate: [0.01, 0.05, 0.1]
    subsample: [0.7, 0.8, 1.0]
    # scale_pos_weight is set automatically from the class ratio at train time

  lightgbm:
    n_estimators: [100, 200, 300]
    num_leaves: [31, 63, 127]
    learning_rate: [0.01, 0.05, 0.1]
    class_weight: balanced

search:
  n_iter: 20  # RandomizedSearchCV samples drawn per tunable family
# Note: the CV fold count comes from configs/config.yaml (run.cv_folds); the
# scoring metric (average_precision), refit, and n_jobs are fixed in
# run_search() and are intentionally not configured here.
