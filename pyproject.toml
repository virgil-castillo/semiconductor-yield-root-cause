[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semiconductor-yield-root-cause"
version = "0.1.0"
description = "Semiconductor yield excursion early-warning and root-cause triage system using SECOM process data."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "shap>=0.45",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "streamlit>=1.35",
    "joblib>=1.4",
    "scipy>=1.13",
    "imbalanced-learn>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml",
    "pandas-stubs",
    "jupyter>=1.0",
    "nbstripout>=0.7",
    "nbformat>=5.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["yield_risk"]

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "joblib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "xgboost.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lightgbm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "shap.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "streamlit.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "imblearn.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the CLI entry points in scripts/ importable by name (e.g. `import
# batch_score`) via pytest's supported pythonpath mechanism, instead of
# mutating sys.path at import time in a conftest.
pythonpath = ["scripts"]
